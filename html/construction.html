<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/construction-style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header></header>
    <div class="container">
        <div class="hero">
            <img src="../img/construction-hero.png" alt="">
            <div class="hero-text">
                <p class="construction-title">施工事例</p>
            </div>
        </div>
        <div class="main-content">
            <h1 class="section-title">施工事例</h1>

            <div class="construction-card-container">
                <p class="construction-card-title">水道管設備工事</p>
                <div class="construction-card">
                    <div class="before-container">
                        <div class="image-wrapper">
                            <img src="../img/water-before.png" alt="">
                            <div class="before-text"><span>Before</span></div>
                        </div>
                        <div class="card-info">
                            <div class="card-text">
                                <span>2019/9/20</span>
                                <span>〇〇市</span>
                            </div>
                            <div class="card-description">
                                <p>給水管設備工事</p>
                            </div>
                        </div>
                    </div>
                    <div class="after-container">
                        <div class="image-wrapper">
                            <img src="../img/water-after.png" alt="">
                            <div class="after-text"><span>After</span></div>
                        </div>
                    </div>
                </div>
            </div>
            <hr>
            <div class="construction-card-container">
                <p class="construction-card-title">一般住宅・ビル等の採水設備工事</p>
                <div class="construction-card">
                    <div class="before-container">
                        <div class="image-wrapper">
                            <img src="../img/water-before.png" alt="">
                            <div class="before-text"><span>Before</span></div>
                        </div>
                        <div class="card-info"> 
                            <div class="card-text">
                                <span>2019/9/20</span>
                                <span>〇〇市</span>
                            </div>
                            <div class="card-description">
                                <p>水道管設備工事</p>
                            </div>
                        </div>
                    </div>
                    <div class="after-container">
                        <div class="image-wrapper">
                            <img src="../img/water-after.png" alt="">
                            <div class="after-text"><span>After</span></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="recruitment-link">
                <a href="#">よくある質問はこちら</a>
                <span class="arrow">→</span>
            </div>
        </div>
    </div>
    <footer></footer>
</body>
</html>
