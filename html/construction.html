<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>施工事例</title>
    <link rel="stylesheet" href="../css/construction-style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header></header>
    <div class="container">
      <div class="hero">
        <img src="../img/construction-hero.png" alt="" />
        <div class="hero-text">
          <p class="construction-title">施工事例</p>
        </div>
      </div>
      <div class="main-content">
        <h1 class="section-title">施工事例</h1>

        <div class="construction-card-container">
          <p class="construction-card-title">水道管設備工事</p>
          <div class="construction-card">
            <img src="../img/alllow.png" alt="" class="allow-change" />
            <div class="before-container">
              <div class="image-wrapper">
                <img src="../img/water-before.png" alt="" />
                <div class="before-text"><span>Before</span></div>
              </div>
              <div class="card-info">
                <div class="card-text">
                  <span>2019/3/17</span>
                  <span>盛岡市</span>
                </div>
                <div class="card-description">
                  <p>[給水管設備工事]</p>
                  <p>
                    経年劣化により錆びついた水道管。水漏れや赤水の原因となっていましたが、新しい配管に交換し、安心・安全な水道環境を実現しました
                  </p>
                </div>
              </div>
            </div>
            <div class="after-container">
              <div class="image-wrapper">
                <img src="../img/water-after.png" alt="" />
                <div class="after-text"><span>After</span></div>
              </div>
            </div>
          </div>
        </div>
        <hr />
        <div class="construction-card-container">
          <p class="construction-card-title">一般住宅・ビル等の採水設備工事</p>
          <div class="construction-card">
            <img src="../img/alllow.png" alt="" class="allow-change" />
            <div class="before-container">
              <div class="image-wrapper">
                <img src="../img/water-before2.png" alt="" />
                <div class="before-text"><span>Before</span></div>
              </div>
              <div class="card-info">
                <div class="card-text">
                  <span>2022/12/20</span>
                  <span>滝沢市</span>
                </div>
                <div class="card-description">
                  <p>[採水設備工事]</p>
                  <p>
                    老朽化した給水設備。効率の低下や故障のリスクを抱えていました。新しい給水システムを導入し、安定した水の供給を実現しました。
                  </p>
                </div>
              </div>
            </div>
            <div class="after-container">
              <div class="image-wrapper">
                <img src="../img/water-after2.png" alt="" />
                <div class="after-text"><span>After</span></div>
              </div>
            </div>
          </div>
        </div>
        <div class="recruitment-link">
          <a href="#">よくある質問はこちら</a>
          <span class="arrow">→</span>
        </div>
      </div>
    </div>
    <footer></footer>
  </body>
</html>
